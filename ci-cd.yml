name: CI-CD CloudNova

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Necessario para o login no Azure por OIDC (sem passwords guardadas)
permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-cloudnova
  LOCATION: spaincentral
  VNET_NAME: vnet-cloudnova
  SUBNET_NAME: frontend-subnet
  ACI_NAME: aci-cloudnova
  IMAGE_NAME: cloudnova-web

jobs:
  validar-e-compilar:
    name: 1. Validar e compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r app/requirements.txt flake8 pytest

      - name: Validar codigo (flake8)
        run: flake8 app tests --max-line-length 120

      - name: Compilar codigo Python
        run: python -m py_compile app/main.py

      - name: Testes automaticos
        run: pytest -q

  build-e-deploy:
    name: 2. Imagem para o ACR e deploy no ACI
    needs: validar-e-compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login no Azure (identidade federada, IDs guardados nos Secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build e push da imagem para o ACR
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME"
          echo "$ACR_PASSWORD" | docker login "$ACR_NAME.azurecr.io" -u "$ACR_USERNAME" --password-stdin
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" app
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Atualizar o contentor no Azure Container Instances
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SQL_CONN: ${{ secrets.SQL_CONN }}
          STORAGE_CONN: ${{ secrets.STORAGE_CONN }}
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
        run: |
          az container create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$ACI_NAME" \
            --location "$LOCATION" \
            --image "$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}" \
            --registry-login-server "$ACR_NAME.azurecr.io" \
            --registry-username "$ACR_USERNAME" \
            --registry-password "$ACR_PASSWORD" \
            --os-type Linux --cpu 1 --memory 1.5 \
            --vnet "$VNET_NAME" --subnet "$SUBNET_NAME" \
            --ip-address Private --ports 5000 \
            --restart-policy Always \
            --environment-variables TENANT_ID="$TENANT_ID" CLIENT_ID="$CLIENT_ID" \
            --secure-environment-variables CLIENT_SECRET="$CLIENT_SECRET" SQL_CONN="$SQL_CONN" \
                STORAGE_CONN="$STORAGE_CONN" FLASK_SECRET_KEY="$FLASK_SECRET_KEY" \
            --output table

      - name: Mostrar IP privado do contentor
        run: |
          az container show -g "$RESOURCE_GROUP" -n "$ACI_NAME" \
            --query "{estado:instanceView.state, ip:ipAddress.ip, imagem:containers[0].image}" -o table
